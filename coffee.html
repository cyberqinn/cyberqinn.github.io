<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>咖啡与酒 | Yiting</title>
    <style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    background-color: #121212;
    color: #e0e0e0;
    max-width: 800px;
    margin: 0 auto;
    padding: 40px 20px;
    line-height: 1.6;
  }
  h1 {
    font-size: 2.5rem;
    color: #64b5f6;
    margin-bottom: 8px;
  }
  .section {
    background-color: #1e1e1e;
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 20px;
    border: 1px solid #2d2d2d;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .section:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
  }
  .section h2 {
    color: #90caf9;
    margin-bottom: 16px;
    font-size: 1.3rem;
  }
  .back-link {
    color: #64b5f6;
    text-decoration: none;
    margin-bottom: 20px;
    display: inline-block;
  }
  .back-link:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>
    <a href="index.html" class="back-link">← 返回主页</a>

    <h1>☕ 咖啡与酒</h1>

    <div class="section">
        <h2>续命清单</h2>
        <ul>
            <li>本命：美式咖啡</li>
            <li>偶尔尝试：手冲咖啡/小众精酿</li>
        </ul>
    </div>

    <div class="section">
        <h2>探店记录</h2>
        <p>这里可以写你去过的咖啡馆、小酒馆，或者喜欢的风味描述</p>
    </div>
</body>
</html>
