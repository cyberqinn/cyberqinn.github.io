<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>摄影 | Yiting</title>
    <style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    background-color: #121212;
    color: #e0e0e0;
    max-width: 800px;
    margin: 0 auto;
    padding: 40px 20px;
    line-height: 1.6;
  }
  h1 {
    font-size: 2.5rem;
    color: #64b5f6;
    margin-bottom: 8px;
  }
  .section {
    background-color: #1e1e1e;
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 20px;
    border: 1px solid #2d2d2d;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .section:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
  }
  .section h2 {
    color: #90caf9;
    margin-bottom: 16px;
    font-size: 1.3rem;
  }
  .back-link {
    color: #64b5f6;
    text-decoration: none;
    margin-bottom: 20px;
    display: inline-block;
  }
  .back-link:hover {
    text-decoration: underline;
  }

  /* 照片网格：一行3张 */
  .photo-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-top: 12px;
  }
  .photo-grid img {
    width: 100%;
    height: 130px;
    object-fit: cover;
    border-radius: 8px;
  }
</style>
</head>
<body>
    <a href="index.html" class="back-link">← 返回主页</a>

    <h1>📷 四季摄影集</h1>

    <!-- 春 -->
    <div class="section">
        <h2>🌸 Spring</h2>
        <div class="photo-grid">
            <img src="spring1.jpg">
            <img src="spring2.jpg">
            <img src="spring3.jpg">
        </div>
    </div>

    <!-- 夏 -->
    <div class="section">
        <h2>☀️ Summer</h2>
        <div class="photo-grid">
            <img src="summer1.jpg">
            <img src="summer2.jpg">
            <img src="summer3.jpg">
        </div>
    </div>

    <!-- 秋 -->
    <div class="section">
        <h2>🍂 Autumn</h2>
        <div class="photo-grid">
            <img src="autumn1.jpg">
            <img src="autumn2.jpg">
            <img src="autumn3.jpg">
        </div>
    </div>

    <!-- 冬 -->
    <div class="section">
        <h2>❄️ Winter</h2>
        <div class="photo-grid">
            <img src="winter1.jpg">
            <img src="winter2.jpg">
            <img src="winter3.jpg">
        </div>
    </div>

</body>
</html>
